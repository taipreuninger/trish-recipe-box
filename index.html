<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trish's Recipe Box</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- HEIC / HEIF Image Converter for iPhone & iPad Photos -->
    <script src="https://unpkg.com/heic2any@0.0.4/dist/heic2any.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Google Sans"', '"Plus Jakarta Sans"', 'Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fef6f0',
                            100: '#fdebe0',
                            200: '#fcd3c1',
                            500: '#e05a47', // Warm Terracotta / Coral Accent
                            600: '#ca4331',
                            700: '#aa3222',
                            900: '#531b14',
                        },
                        cream: '#FAF7F2',
                        sage: '#4A7C59',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            font-family: 'Google Sans', 'Plus Jakarta Sans', 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const CATEGORIES = [
            "All",
            "Appetizers",
            "Soups",
            "Salads",
            "Breads",
            "Desserts",
            "Breakfast",
            "Beverages",
            "Main Dishes",
            "Vegetables",
            "Other"
        ];

        const INITIAL_RECIPES = [
            {
                id: "sample-1",
                title: "Trish's Golden Honey Butter Biscuits",
                category: "Breads",
                prepTime: "15 mins",
                cookTime: "18 mins",
                servings: "8 biscuits",
                imageUrl: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=800&q=80",
                description: "Flaky, multi-layered buttermilk biscuits brushed with warm wildflower honey butter straight out of the oven.",
                ingredients: [
                    "2 1/2 cups all-purpose flour",
                    "1 tbsp baking powder",
                    "1/2 tsp baking soda",
                    "1 tsp salt",
                    "1/2 cup cold unsalted butter, cubed",
                    "1 cup cold buttermilk",
                    "3 tbsp honey melted with 2 tbsp butter (for glaze)"
                ],
                instructions: [
                    "Preheat oven to 425°F (220°C) and line a baking sheet with parchment paper.",
                    "In a large bowl, whisk together flour, baking powder, baking soda, and salt.",
                    "Cut in the cold cubed butter using a pastry cutter or your fingers until crumbly.",
                    "Pour in cold buttermilk and stir gently until just combined. Do not overmix!",
                    "Turn dough onto a lightly floured surface, fold over itself 5-6 times for flaky layers, and press to 1-inch thickness.",
                    "Cut biscuits using a round cutter. Place close together on baking sheet.",
                    "Bake for 15-18 minutes until golden brown.",
                    "Brush immediately with warm honey butter and serve hot."
                ]
            },
            {
                id: "sample-2",
                title: "Creamy Roasted Tomato Basil Soup",
                category: "Soups",
                prepTime: "10 mins",
                cookTime: "30 mins",
                servings: "4 bowls",
                imageUrl: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80",
                description: "Rich, comforting soup made from oven-roasted vine tomatoes, garlic, fresh basil, and a splash of heavy cream.",
                ingredients: [
                    "3 lbs ripe vine tomatoes, halved",
                    "1 head of garlic, top cut off",
                    "3 tbsp olive oil",
                    "1 onion, chopped",
                    "2 cups vegetable or chicken broth",
                    "1/2 cup fresh basil leaves",
                    "1/2 cup heavy cream",
                    "Salt and black pepper to taste"
                ],
                instructions: [
                    "Roast tomatoes and garlic drizzled with olive oil at 400°F (200°C) for 30 minutes until caramelized.",
                    "In a pot, sauté chopped onion in olive oil until soft.",
                    "Squeeze roasted garlic out of peel into pot, add tomatoes, and pour in broth.",
                    "Simmer for 10 minutes, then add fresh basil.",
                    "Blend with an immersion blender until silky smooth.",
                    "Stir in heavy cream, season with salt and pepper, and serve warm with grilled cheese."
                ]
            }
        ];

        function App() {
            const [recipes, setRecipes] = useState(() => {
                const saved = localStorage.getItem('trish_recipes');
                return saved ? JSON.parse(saved) : INITIAL_RECIPES;
            });

            const [userApiKey, setUserApiKey] = useState(() => {
                return localStorage.getItem('trish_gemini_api_key') || '';
            });

            const [selectedCategory, setSelectedCategory] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");
            const [viewMode, setViewMode] = useState('grid');
            const [activeRecipe, setActiveRecipe] = useState(null);
            const [isKitchenMode, setIsKitchenMode] = useState(false);
            
            // Modal States
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [editingRecipeId, setEditingRecipeId] = useState(null);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [importTab, setImportTab] = useState('photo');
            
            // Custom Alert / Notification Modal State
            const [notice, setNotice] = useState(null);
            const [deleteConfirmRecipeId, setDeleteConfirmRecipeId] = useState(null);

            // AI Extraction State
            const [isProcessing, setIsProcessing] = useState(false);
            const [processingStatus, setProcessingStatus] = useState('');
            const [pastedLinkOrText, setPastedLinkOrText] = useState('');
            const [frontImage, setFrontImage] = useState(null);
            const [backImage, setBackImage] = useState(null);

            const [formData, setFormData] = useState({
                title: '',
                category: 'Main Dishes',
                prepTime: '15 mins',
                cookTime: '30 mins',
                servings: '4 servings',
                imageUrl: '',
                description: '',
                ingredientsText: '',
                instructionsText: ''
            });

            useEffect(() => {
                localStorage.setItem('trish_recipes', JSON.stringify(recipes));
            }, [recipes]);

            useEffect(() => {
                localStorage.setItem('trish_gemini_api_key', userApiKey);
            }, [userApiKey]);

            const showAlert = (message, title = "Notice") => {
                setNotice({ message, title });
            };

            const callGeminiVisionOrText = async (prompt, base64Images = []) => {
                if (!userApiKey.trim()) {
                    throw new Error("NO_API_KEY");
                }

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${userApiKey.trim()}`;

                const parts = [{ text: prompt }];
                const imagesArray = Array.isArray(base64Images) ? base64Images : [base64Images].filter(Boolean);

                imagesArray.forEach(img => {
                    let mimeType = "image/jpeg";
                    if (img.startsWith("data:image/png")) mimeType = "image/png";
                    if (img.startsWith("data:image/webp")) mimeType = "image/webp";
                    parts.push({
                        inlineData: {
                            mimeType: mimeType,
                            data: img.split(',')[1] || img
                        }
                    });
                });

                const systemInstruction = `You are a warm, helpful kitchen assistant for Trish. Your job is to extract recipe information accurately into JSON format.
If multiple photos are provided (e.g. front and back of a recipe card), combine all information from both images into one single complete recipe.
Return ONLY a valid JSON object matching this structure:
{
  "title": "Recipe Title",
  "category": "Must be one of: Appetizers, Soups, Salads, Breads, Desserts, Breakfast, Beverages, Main Dishes, Vegetables, Other",
  "prepTime": "e.g. 15 mins",
  "cookTime": "e.g. 30 mins",
  "servings": "e.g. 4 servings",
  "description": "Short delicious 1-2 sentence description",
  "ingredients": ["ingredient 1", "ingredient 2"],
  "instructions": ["step 1", "step 2"]
}`;

                const payload = {
                    contents: [{ parts }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("API_ERROR");
                const result = await res.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                return JSON.parse(jsonText);
            };

            const generateAiImage = async (title, category) => {
                if (!userApiKey.trim()) return `https://placehold.co/800x600/fdebe0/e05a47?text=${encodeURIComponent(title)}`;
                
                setProcessingStatus('🎨 Creating an appetizing photo with AI...');
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${userApiKey.trim()}`;
                    
                    const prompt = `A mouth-watering, delicious gourmet food photography shot of ${title} (${category}), warm soft kitchen lighting, cozy rustic plating, culinary magazine style`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseModalities: ['TEXT', 'IMAGE']
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    
                    if (base64Data) {
                        return `data:image/png;base64,${base64Data}`;
                    }
                } catch (err) {
                    console.error("AI Image Generation error:", err);
                }
                return `https://placehold.co/800x600/fdebe0/e05a47?text=${encodeURIComponent(title)}`;
            };

            const handleImageUpload = async (e, setImageSetter) => {
                const file = e.target.files[0];
                if (!file) return;

                let fileToRead = file;

                // Check for iPhone / iPad HEIC or HEIF files
                const isHeic = file.type.includes('heic') || file.type.includes('heif') || 
                               file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif');

                if (isHeic) {
                    try {
                        setProcessingStatus('📱 Converting iPhone HEIC photo...');
                        if (window.heic2any) {
                            const convertedBlob = await window.heic2any({
                                blob: file,
                                toType: 'image/jpeg',
                                quality: 0.85
                            });
                            fileToRead = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                        }
                    } catch (conversionErr) {
                        console.warn("HEIC Conversion note:", conversionErr);
                    }
                }

                const reader = new FileReader();
                reader.onloadend = () => setImageSetter(reader.result);
                reader.readAsDataURL(fileToRead);
            };

            const handleExtractRecipe = async () => {
                if (!userApiKey.trim()) {
                    showAlert(
                        "AI Scanning requires a Google Gemini API Key. Tap the ⚙️ Settings button at top right to enter a key, or click 'Review & Save' to fill in the recipe manually!",
                        "API Key Optional"
                    );
                    setImportTab('manual');
                    return;
                }

                setIsProcessing(true);
                setProcessingStatus('🔍 Reading recipe details...');

                try {
                    let extracted = null;
                    if (importTab === 'photo' && (frontImage || backImage)) {
                        setProcessingStatus('📸 Analyzing recipe photos...');
                        const photosToAnalyze = [frontImage, backImage].filter(Boolean);
                        extracted = await callGeminiVisionOrText(
                            "Extract all recipe details from these photos of a recipe card, screenshot, or page. Combine all ingredients and steps from both images into one complete recipe.",
                            photosToAnalyze
                        );
                    } else if (importTab === 'link' && pastedLinkOrText) {
                        setProcessingStatus('🌐 Parsing recipe from link or text...');
                        extracted = await callGeminiVisionOrText(
                            `Extract all recipe details from the following content:\n\n${pastedLinkOrText}`
                        );
                    }

                    if (extracted) {
                        let img = frontImage || backImage || extracted.imageUrl || '';
                        if (!img) {
                            setProcessingStatus('✨ Generating photo for Trish...');
                            img = await generateAiImage(extracted.title || 'Delicious Recipe', extracted.category || 'Main Dishes');
                        }

                        setFormData({
                            title: extracted.title || '',
                            category: CATEGORIES.includes(extracted.category) ? extracted.category : 'Main Dishes',
                            prepTime: extracted.prepTime || '15 mins',
                            cookTime: extracted.cookTime || '25 mins',
                            servings: extracted.servings || '4 servings',
                            imageUrl: img,
                            description: extracted.description || '',
                            ingredientsText: Array.isArray(extracted.ingredients) ? extracted.ingredients.join('\n') : '',
                            instructionsText: Array.isArray(extracted.instructions) ? extracted.instructions.join('\n') : ''
                        });
                        setImportTab('manual');
                    }
                } catch (err) {
                    if (err.message === "NO_API_KEY") {
                        showAlert("Please tap the ⚙ Settings icon at the top right to save your free Google Gemini API Key first!", "Key Required");
                    } else {
                        showAlert("Could not automatically parse that recipe structure. You can fill out or adjust the fields manually on the Review & Save tab!");
                    }
                    setImportTab('manual');
                } finally {
                    setIsProcessing(false);
                    setProcessingStatus('');
                }
            };

            const handleEditRecipe = (recipe) => {
                setEditingRecipeId(recipe.id);
                setFormData({
                    title: recipe.title || '',
                    category: recipe.category || 'Main Dishes',
                    prepTime: recipe.prepTime || '',
                    cookTime: recipe.cookTime || '',
                    servings: recipe.servings || '',
                    imageUrl: recipe.imageUrl || '',
                    description: recipe.description || '',
                    ingredientsText: Array.isArray(recipe.ingredients) ? recipe.ingredients.join('\n') : '',
                    instructionsText: Array.isArray(recipe.instructions) ? recipe.instructions.join('\n') : ''
                });
                setImportTab('manual');
                setIsAddModalOpen(true);
            };

            const handleSaveRecipe = (e) => {
                e.preventDefault();
                if (!formData.title.trim()) {
                    showAlert("Please provide a recipe title.");
                    return;
                }

                const recipeData = {
                    id: editingRecipeId || ('recipe-' + Date.now()),
                    title: formData.title,
                    category: formData.category,
                    prepTime: formData.prepTime || '15 mins',
                    cookTime: formData.cookTime || '20 mins',
                    servings: formData.servings || '4 servings',
                    imageUrl: formData.imageUrl || `https://placehold.co/800x600/fdebe0/e05a47?text=${encodeURIComponent(formData.title)}`,
                    description: formData.description,
                    ingredients: formData.ingredientsText.split('\n').filter(line => line.trim().length > 0),
                    instructions: formData.instructionsText.split('\n').filter(line => line.trim().length > 0)
                };

                if (editingRecipeId) {
                    setRecipes(recipes.map(r => r.id === editingRecipeId ? recipeData : r));
                    if (activeRecipe && activeRecipe.id === editingRecipeId) {
                        setActiveRecipe(recipeData);
                    }
                } else {
                    setRecipes([recipeData, ...recipes]);
                    setActiveRecipe(recipeData);
                }

                setIsAddModalOpen(false);
                resetForm();
            };

            const resetForm = () => {
                setEditingRecipeId(null);
                setFormData({
                    title: '',
                    category: 'Main Dishes',
                    prepTime: '15 mins',
                    cookTime: '30 mins',
                    servings: '4 servings',
                    imageUrl: '',
                    description: '',
                    ingredientsText: '',
                    instructionsText: ''
                });
                setFrontImage(null);
                setBackImage(null);
                setPastedLinkOrText('');
                setImportTab('photo');
            };

            const confirmDeleteRecipe = () => {
                if (deleteConfirmRecipeId) {
                    setRecipes(recipes.filter(r => r.id !== deleteConfirmRecipeId));
                    setActiveRecipe(null);
                    setDeleteConfirmRecipeId(null);
                }
            };

            const filteredRecipes = recipes.filter(r => {
                const matchesCategory = selectedCategory === "All" || r.category === selectedCategory;
                const matchesQuery = searchQuery === "" || 
                    r.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    r.ingredients.some(ing => ing.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchesCategory && matchesQuery;
            }).sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));

            return (
                <div className="max-w-4xl mx-auto px-4 pt-4 sm:pt-6">
                    {/* APP HEADER */}
                    <header className="flex items-center justify-between bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-orange-100/60 mb-6">
                        <div className="flex items-center gap-3 sm:gap-4">
                            <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-brand-500 text-white flex items-center justify-center font-bold text-2xl shadow-md shadow-brand-500/20">
                                🍳
                            </div>
                            <div>
                                <h1 className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Trish's Recipe Box</h1>
                                <p className="text-xs sm:text-sm text-slate-500 font-medium">Your Kitchen Companion • {recipes.length} Saved Recipes</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => setIsSettingsOpen(true)}
                                className="p-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-bold transition-all cursor-pointer text-lg"
                                title="Settings & API Key"
                            >
                                ⚙️
                            </button>
                            <button 
                                onClick={() => { resetForm(); setIsAddModalOpen(true); }}
                                className="bg-brand-500 hover:bg-brand-600 active:scale-95 transition-all text-white font-bold px-4 sm:px-6 py-3 rounded-2xl flex items-center gap-2 shadow-lg shadow-brand-500/25 text-sm sm:text-base cursor-pointer"
                            >
                                <span className="text-xl font-bold">+</span>
                                <span className="hidden sm:inline">Add Recipe</span>
                                <span className="sm:hidden">Add</span>
                            </button>
                        </div>
                    </header>

                    {/* SEARCH & CATEGORY FILTERS */}
                    <div className="space-y-4 mb-6">
                        <div className="relative">
                            <input 
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="🔍 Search recipes or ingredients (e.g., chicken, honey)..."
                                className="w-full bg-white text-slate-800 font-medium text-base sm:text-lg px-5 py-4 pl-12 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500/50 shadow-sm"
                            />
                            {searchQuery && (
                                <button 
                                    onClick={() => setSearchQuery('')}
                                    className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 font-bold p-2 text-lg cursor-pointer"
                                >
                                    ✕
                                </button>
                            )}
                        </div>

                        {}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div className="flex gap-2 overflow-x-auto no-scrollbar py-1 flex-1">
                                {CATEGORIES.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-4 py-2.5 rounded-full text-sm sm:text-base font-semibold whitespace-nowrap transition-all cursor-pointer ${
                                            selectedCategory === cat
                                                ? 'bg-slate-900 text-white shadow-md'
                                                : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200/80'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            <div className="flex items-center justify-between sm:justify-end gap-3 shrink-0 pt-1 sm:pt-0">
                                <span className="text-xs font-semibold text-slate-500">
                                    {filteredRecipes.length} {filteredRecipes.length === 1 ? 'recipe' : 'recipes'} (A–Z)
                                </span>
                                <div className="flex items-center bg-white p-1 rounded-2xl border border-slate-200 shadow-sm">
                                    <button
                                        onClick={() => setViewMode('grid')}
                                        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer ${
                                            viewMode === 'grid'
                                                ? 'bg-brand-500 text-white shadow-sm'
                                                : 'text-slate-500 hover:text-slate-800'
                                        }`}
                                    >
                                        <span>🎴</span>
                                        <span>Cards</span>
                                    </button>
                                    <button
                                        onClick={() => setViewMode('list')}
                                        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition-all cursor-pointer ${
                                            viewMode === 'list'
                                                ? 'bg-brand-500 text-white shadow-sm'
                                                : 'text-slate-500 hover:text-slate-800'
                                        }`}
                                    >
                                        <span>📋</span>
                                        <span>List</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    {filteredRecipes.length === 0 ? (
                        <div className="bg-white rounded-3xl p-10 text-center border border-dashed border-slate-300">
                            <div className="text-5xl mb-3">📖</div>
                            <h3 className="text-xl font-bold text-slate-800 mb-1">No recipes found</h3>
                            <p className="text-slate-500 mb-6 text-sm">Try choosing a different category or add your first recipe!</p>
                            <button 
                                onClick={() => { resetForm(); setIsAddModalOpen(true); }}
                                className="bg-brand-500 text-white font-bold px-6 py-3 rounded-2xl text-base shadow-md cursor-pointer"
                            >
                                + Add First Recipe
                            </button>
                        </div>
                    ) : viewMode === 'grid' ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                            {filteredRecipes.map(recipe => (
                                <div 
                                    key={recipe.id}
                                    onClick={() => setActiveRecipe(recipe)}
                                    className="bg-white rounded-3xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-md transition-all cursor-pointer group flex flex-col"
                                >
                                    <div className="relative h-48 bg-slate-100 overflow-hidden">
                                        <img 
                                            src={recipe.imageUrl} 
                                            alt={recipe.title}
                                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                            onError={(e) => {
                                                e.target.src = `https://placehold.co/800x600/fdebe0/e05a47?text=${encodeURIComponent(recipe.title)}`;
                                            }}
                                        />
                                        <span className="absolute top-3 left-3 bg-white/95 backdrop-blur-sm text-slate-800 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm">
                                            {recipe.category}
                                        </span>
                                    </div>

                                    <div className="p-5 flex-1 flex flex-col justify-between">
                                        <div>
                                            <h3 className="font-bold text-slate-900 text-lg sm:text-xl leading-snug mb-2 group-hover:text-brand-500 transition-colors">
                                                {recipe.title}
                                            </h3>
                                            {recipe.description && (
                                                <p className="text-slate-600 text-xs sm:text-sm line-clamp-2 mb-4">
                                                    {recipe.description}
                                                </p>
                                            )}
                                        </div>

                                        <div className="flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-500 border-t border-slate-100 pt-3 mt-2">
                                            <div className="flex items-center gap-1">
                                                <span>⏱️</span> {recipe.cookTime || recipe.prepTime}
                                            </div>
                                            <div className="flex items-center gap-1 text-brand-600 font-bold">

                                            <button 
                                                onClick={() => setDeleteConfirmRecipeId(activeRecipe.id)}
                                                className="text-red-500 hover:text-red-700 hover:bg-red-50 font-bold text-sm px-3.5 py-2.5 rounded-xl transition-colors cursor-pointer"
                                            >
                                                🗑️ Delete
                                            </button>
                                        </div>
                                        <button 
                                            onClick={() => setIsKitchenMode(true)}
                                            className="bg-brand-500 hover:bg-brand-600 text-white font-bold px-6 py-3 rounded-2xl text-base shadow-md cursor-pointer"
                                        >
                                            Start Cooking Mode 👩‍🍳
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {activeRecipe && isKitchenMode && (
                        <KitchenMode 
                            recipe={activeRecipe} 
                            onClose={() => setIsKitchenMode(false)} 
                        />
                    )}

                    {/* CUSTOM NOTICE MODAL */}
                    {notice && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4 border border-slate-100">
                                <div className="text-4xl">ℹ️</div>
                                <h3 className="font-bold text-slate-900 text-lg">{notice.title || "Notice"}</h3>
                                <p className="text-slate-600 text-sm">{notice.message}</p>
                                <button 
                                    onClick={() => setNotice(null)}
                                    className="bg-brand-500 text-white font-bold px-6 py-2.5 rounded-2xl w-full cursor-pointer"
                                >
                                    Got it
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM DELETE CONFIRMATION MODAL */}
                    {deleteConfirmRecipeId && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4 border border-slate-100">
                                <div className="text-4xl">🗑</div>
                                <h3 className="font-bold text-slate-900 text-lg">Delete Recipe?</h3>
                                <p className="text-slate-600 text-sm">Are you sure you want to remove this recipe from Trish's collection?</p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setDeleteConfirmRecipeId(null)}
                                        className="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-2xl cursor-pointer"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={confirmDeleteRecipe}
                                        className="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-2xl cursor-pointer"
                                    >
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function KitchenMode({ recipe, onClose }) {
            const [currentStep, setCurrentStep] = useState(0);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);

            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(sec => sec - 1);
                    }, 1000);
                } else if (timerSeconds === 0) {
                    setTimerActive(false);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const speakCurrentStep = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const text = recipe.instructions[currentStep];
                    const utterance = new SpeechSynthesisUtterance(`Step ${currentStep + 1}: ${text}`);
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            };

            return (
                <div className="fixed inset-0 bg-cream z-50 flex flex-col justify-between p-4 sm:p-8">
                    <div className="flex items-center justify-between border-b border-orange-200/80 pb-4">
                        <div>
                            <span className="text-xs font-bold text-brand-600 uppercase tracking-wide">Trish's Kitchen Mode</span>
                            <h2 className="text-xl sm:text-2xl font-bold text-slate-900 truncate max-w-md">{recipe.title}</h2>
                        </div>
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={speakCurrentStep}
                                className="bg-amber-100 text-amber-800 font-bold px-4 py-2.5 rounded-full text-base flex items-center gap-2 border border-amber-200 cursor-pointer"
                            >
                                🔊 Read Aloud
                            </button>
                            <button 
                                onClick={onClose}
                                className="bg-slate-900 text-white font-bold px-5 py-2.5 rounded-full text-base cursor-pointer"
                            >
                                Exit Mode ✕
                            </button>
                        </div>
                    </div>

                    <div className="my-auto max-w-3xl mx-auto w-full bg-white p-6 sm:p-10 rounded-3xl border-2 border-orange-200 shadow-xl space-y-6">
                        <div className="flex justify-between items-center text-slate-500 font-bold text-sm sm:text-base">
                            <span>STEP {currentStep + 1} OF {recipe.instructions.length}</span>
                            <span>⏱️ {recipe.cookTime}</span>
                        </div>

                        <p className="text-2xl sm:text-4xl font-semibold text-slate-900 leading-relaxed sm:leading-loose">
                            {recipe.instructions[currentStep]}
                        </p>

                        <div className="pt-6 border-t border-slate-100 flex items-center justify-between bg-orange-50/50 p-4 rounded-2xl">
                            <div className="flex items-center gap-3">
                                <span className="text-3xl">⏲️</span>
                                <div>
                                    <span className="text-xs font-bold text-slate-500 block">KITCHEN TIMER</span>
                                    <span className="text-2xl font-bold text-slate-900 font-mono">
                                        {formatTime(timerSeconds)}
                                    </span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => { setTimerSeconds(s => s + 300); setTimerActive(true); }}
                                    className="bg-white border border-slate-300 font-bold px-3 py-2 rounded-xl text-xs sm:text-sm cursor-pointer"
                                >
                                    +5 Mins
                                </button>
                                <button 
                                    onClick={() => setTimerActive(!timerActive)}
                                    className={`font-bold px-4 py-2 rounded-xl text-xs sm:text-sm text-white cursor-pointer ${timerActive ? 'bg-amber-600' : 'bg-brand-500'}`}
                                >
                                    {timerActive ? 'Pause' : 'Start'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between items-center max-w-3xl mx-auto w-full gap-4 pt-4">
                        <button 
                            disabled={currentStep === 0}
                            onClick={() => setCurrentStep(c => c - 1)}
                            className="flex-1 bg-white border border-slate-300 disabled:opacity-30 text-slate-800 font-bold py-5 rounded-2xl text-xl shadow-sm text-center cursor-pointer"
                        >
                            ← Previous Step
                        </button>
                        
                        <button 
                            disabled={currentStep === recipe.instructions.length - 1}
                            onClick={() => setCurrentStep(c => c + 1)}
                            className="flex-1 bg-brand-500 disabled:opacity-30 text-white font-bold py-5 rounded-2xl text-xl shadow-md text-center cursor-pointer"
                        >
                            Next Step →
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
